<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPX SOC Portal</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/views-ops.css">
<link rel="stylesheet" href="css/views-data.css">
<link rel="stylesheet" href="css/views-schedule.css">
<link rel="stylesheet" href="css/views-people.css">
</head>
<body>
<a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spin-big" aria-hidden="true"></div>
  <p>Đang tải dữ liệu…</p>
</div>

<!-- Header chỉ hiện trên mobile ≤700px — desktop sidebar là chrome duy nhất -->
<header class="app-header">
  <button type="button" class="btn-icon-dark" data-action="drawer" id="btnDrawer" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="sidebar" title="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
  </button>
  <div class="brand">
    <span class="brand-title" id="brandTitleM">SOC Portal</span>
  </div>
  <div class="header-right">
    <span class="header-user" id="userEmail" aria-label="Người dùng đang đăng nhập"></span>
    <span class="net-dot" id="netDot" role="img" aria-label="Trạng thái mạng: Online" title="Trạng thái mạng"></span>
    <button type="button" class="btn-icon-dark" data-action="refresh" aria-label="Làm mới dữ liệu" title="Làm mới">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button type="button" class="btn-icon-dark" data-action="sound" aria-label="Tắt/Mở âm thanh" aria-pressed="true" title="Tắt âm thanh">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 5.4a9 9 0 0 1 0 13.2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <button type="button" class="btn-icon-dark" data-action="theme" aria-label="Bật/Tắt giao diện tối" aria-pressed="false" title="Bật giao diện tối">
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="app-shell">
  <aside id="sidebar" aria-label="Điều hướng chính">
    <div class="side-mark">
      <span class="side-mark__box" aria-hidden="true">SOC</span>
      <span class="side-mark__text">
        <span class="side-mark__title" id="brandTitle">SOC Portal</span>
        <span class="side-mark__sub">Kho Trung tâm · Vận hành ca</span>
      </span>
    </div>

    <nav class="side-nav" id="sideNav" aria-label="Danh sách trang"></nav>
    <div class="side-roles" id="sideRoles" hidden></div>

    <div class="side-card" role="status" aria-live="polite">
      <span class="side-card__title">Kết nối hệ thống</span>
      <span class="side-card__row"><span class="net-dot" id="netDotM2" role="img" aria-label="Trạng thái mạng: Online"></span><span id="netTextM2">Sheets · trực tuyến</span></span>
      <span class="side-card__row" id="clockText">Đồng bộ lúc mở trang</span>
      <span class="side-card__row bg-task-indicator" id="bgTaskIndicatorM2" style="display:none"><span class="bg-spinner" aria-hidden="true"></span><span id="bgTaskCountM2">0</span> việc nền</span>
    </div>

    <div class="side-user">
      <span class="side-user__avatar" id="sideAvatar" aria-hidden="true">?</span>
      <span class="side-user__text">
        <span class="side-user__email" id="userEmailM2">Đang tải…</span>
        <span class="side-user__role" id="sideRole"></span>
      </span>
    </div>

    <div class="side-foot">
      <div class="side-version">SOC Portal · bản dựng sạch v3.0</div>
      <div class="side-foot-actions">
        <button type="button" class="btn-icon-dark" data-action="refresh" id="btnRefresh" aria-label="Làm mới dữ liệu" title="Làm mới">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button type="button" class="btn-icon-dark" data-action="sound" id="btnSound" aria-label="Tắt/Mở âm thanh" aria-pressed="true" title="Tắt âm thanh">
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 5.4a9 9 0 0 1 0 13.2"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        </button>
        <button type="button" class="btn-icon-dark" data-action="theme" id="btnTheme" aria-label="Bật/Tắt giao diện tối" aria-pressed="false" title="Bật giao diện tối">
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="btn-icon-dark" data-action="compact" id="btnSidebarCompact" aria-label="Thu gọn hoặc mở rộng menu" aria-pressed="false" title="Thu gọn menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h16"/><path d="M20 8l-4 4 4 4"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main id="main-content" tabindex="-1">
    <div class="page-head">
      <div class="page-head__main">
        <nav class="crumb" id="breadcrumb" aria-label="Đường dẫn trang"></nav>
        <div id="viewChrome"></div>
      </div>
      <div class="topbar-actions" id="pageActions"></div>
    </div>

    <!-- 13 section — nội dung do js/view-*.js render theo hợp đồng §3c. -->
    <section id="viewHome" class="hidden"></section>
    <section id="viewTasks" class="hidden"></section>
    <section id="viewScan" class="hidden"></section>
    <section id="viewStats" class="hidden"></section>
    <section id="viewStaff" class="hidden"></section>
    <section id="viewSchedule" class="hidden"></section>
    <section id="viewSchedulePersonal" class="hidden"></section>
    <section id="viewScheduleDaily" class="hidden"></section>
    <section id="viewInformation" class="hidden"></section>
    <section id="viewLeave" class="hidden"></section>
    <section id="viewAdmin" class="hidden"></section>
    <section id="viewConfig" class="hidden"></section>
    <section id="viewAbout" class="hidden"></section>
  </main>
</div>

<div id="drawerScrim" class="drawer-scrim" aria-hidden="true"></div>
<div id="slideOverOverlay" class="slide-over-overlay hidden" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="confirmModal" class="about-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-hidden="true">
  <div class="about-dialog">
    <div class="modal-head"><h2 id="confirmModalTitle">Xác nhận</h2></div>
    <p class="mode-desc" id="confirmModalMsg"></p>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="confirmCancelBtn">Hủy</button>
      <button type="button" class="btn" id="confirmOkBtn">Đồng ý</button>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/view-home.js"></script>
<script src="js/view-tasks.js"></script>
<script src="js/view-scan.js"></script>
<script src="js/view-stats.js"></script>
<script src="js/view-staff.js"></script>
<script src="js/view-schedule.js"></script>
<script src="js/view-schedule-personal.js"></script>
<script src="js/view-schedule-daily.js"></script>
<script src="js/view-information.js"></script>
<script src="js/view-leave.js"></script>
<script src="js/view-config.js"></script>
<script src="js/view-admin.js"></script>
<script src="js/view-about.js"></script>
<script>
  SOC.wireChrome();
  SOC.boot();
</script>
</body>
</html>
